<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摄影社 · 招新报名</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>📷 光影摄影社</h1>
        <p>2026秋季招新 · 用镜头记录世界</p>
    </header>

    <nav>
        <ul>
            <li><a href="#">首页</a></li>
            <li><a href="#">社团介绍</a></li>
            <li><a href="#" class="active">招新报名</a></li>
            <li><a href="#">联系我们</a></li>
        </ul>
    </nav>

    <main>
        <section id="form-section">
            <h2>报名申请表</h2>
            <p class="hint">请如实填写以下信息，所有带 <span class="required-star">*</span> 的为必填项。</p>

            <form id="signupForm" action="#" method="post">
                <!-- 个人信息 -->
                <fieldset>
                    <legend>📋 个人信息</legend>

                    <div class="form-group">
                        <label for="name">姓名 <span class="required-star">*</span> :</label>
                        <input type="text" id="name" name="name" placeholder="请输入真实姓名">
                    </div>

                    <div class="form-group">
                        <label for="studentId">学号（11位数字） <span class="required-star">*</span> :</label>
                        <input type="text" id="studentId" name="studentId" placeholder="请输入11位学号">
                    </div>

                    <!-- 其余控件暂时省略，留到第二次提交 -->
                </fieldset>

                <div class="form-actions">
                    <button type="submit">提交报名</button>
                    <button type="reset">重置</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 光影摄影社 | 地址：校园活动中心3楼 | 邮箱：photo@stu.edu</p>
    </footer>
</body>
</html>
