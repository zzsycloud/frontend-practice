<!DOCTYPE html>
<html>
<body>
  <script>
    // 模拟：手动在控制台或代码中存入非法 JSON 字符串
    localStorage.setItem('myData', '{name: "张三",}'); // 非法 JSON（name没有引号，尾部有多余逗号）

    // 防御性读取
    function safeGetData() {
      try {
        const raw = localStorage.getItem('myData');
        const data = JSON.parse(raw); // 这里会抛出 SyntaxError
        console.log('解析成功:', data);
        return data;
      } catch (error) {
        // 捕获错误，避免程序崩溃
        console.error('JSON 解析失败，已启用默认值。错误信息:', error.message);
        return { name: '默认用户' }; // 返回兜底数据
      }
    }

    const result = safeGetData();
    console.log('最终使用的数据:', result);
  </script>
</body>
</html>
