<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光影摄影社 · 招新</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 基础样式 -->
    <style>
        body {
            padding-top: 70px;
            background: #f8f9fa;
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: 2px;
        }
        .hero {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white;
            padding: 4rem 0;
            margin-bottom: 2rem;
            border-radius: 0 0 30px 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .hero h1 {
            font-size: 3rem;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top shadow">
        <div class="container">
            <a class="navbar-brand" href="#">
                <span style="color: #ffd700;">📷</span> 光影摄影社
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto mb-2 mb-md-0">
                    <li class="nav-item"><a class="nav-link active" href="#about">关于</a></li>
                    <li class="nav-item"><a class="nav-link" href="#works">作品</a></li>
                    <li class="nav-item"><a class="nav-link" href="#join">加入</a></li>
                </ul>
            </div>
        </div>
    </nav>

    
    <section class="hero">
        <div class="container text-center">
            <h1>用镜头 捕捉世界</h1>
            <p class="lead mt-3">光影摄影社 · 2026秋季招新</p>
            <p class="mb-4">无论新手或大师，这里都有你的舞台</p>
            <a href="#join" class="btn btn-outline-light btn-lg">立即报名</a>
        </div>
    </section>


    <section id="about" class="container mb-5">
        <div class="row align-items-center">
            <div class="col-md-6">
                <h2 class="fw-bold">关于我们</h2>
                <p class="text-muted">光影摄影社成立于2010年，是校内最活跃的艺术类社团之一。我们定期组织外拍、暗房体验、后期教学和作品展览。无论你使用手机还是专业相机，只要热爱观察与记录，欢迎加入。</p>
                <ul class="list-unstyled">
                    <li>✔ 每周一次线下交流</li>
                    <li>✔ 每月一次主题外拍</li>
                    <li>✔ 年度摄影展 & 比赛</li>
                </ul>
            </div>
            <div class="col-md-6">
                <img src="https://picsum.photos/600/300?random=1" alt="社团合影" class="img-fluid rounded shadow">
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
