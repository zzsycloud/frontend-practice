    <h1>🎮 我的世界（Minecraft）</h1>

    <h2>游戏简介</h2>
    <p>
        《我的世界》是一款由 Mojang Studios 开发的沙盒游戏，玩家可以在一个由方块构成的 3D 世界中自由探索、建造和冒险。
        自 2009 年发布以来，它已成为史上销量最高的电子游戏，以其无限创造力和开放玩法吸引了全球数亿玩家。
    </p>
    <p>
        游戏没有固定的剧情或目标，玩家可以选择生存模式（收集资源、对抗怪物）、创造模式（无限建材、随心建造）或冒险模式等。
        无论是搭建宏伟城堡、还原现实地标，还是探索地牢、挑战末影龙，一切皆有可能。
    </p>
