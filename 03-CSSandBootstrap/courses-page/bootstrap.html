<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <style>
  /* 覆盖示例：让卡片标题统一品牌色 */
  .card .card-title {
    color: #0b5ed7;
  }
    @media print {
    /* ① 隐藏导航栏 */
    .navbar {
      display: none !important;
    }

    /* ② 隐藏页脚 */
    footer {
      display: none !important;
    }

    /* ③ 正文强制单栏显示 */
    /* 让每个卡片占满整行，取消Bootstrap的栅格分栏 */
    .row > .col-md-6,
    .row > .col-lg-4 {
      flex: 0 0 100% !important;   /* 宽度强制100% */
      max-width: 100% !important;
    }

    /* ④ 白底黑字，去掉背景色 */
    body {
      background: #fff !important;
      color: #000 !important;
    }

    /* ⑤ 卡片也强制白底黑字，去掉阴影 */
    .card {
      background: #fff !important;
      border: 1px solid #ccc !important;
      box-shadow: none !important;
    }
  }
</style>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>课程展示 - Bootstrap版</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container">
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-md bg-body-tertiary mb-4">
      <div class="container">
        <a class="navbar-brand" href="#">前端课程墙</a>
        <div class="navbar-nav">
          <a class="nav-link active" href="#">全部课程</a>
          <a class="nav-link" href="#">关于</a>
        </div>
      </div>
    </nav>

    <!-- 卡片栅格 -->
    <div class="row g-3">
      <div class="col-md-6 col-lg-4">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">HTML入门</h5>
            <p class="card-text">结构与语义，页面一切的起点。</p>
            <a href="#" class="btn btn-primary">查看详情</a>
          </div>
        </div>
      </div>
      <!-- 第二张卡片 -->
      <div class="col-md-6 col-lg-4">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">CSS布局</h5>
            <p class="card-text">Flex、Grid与响应式设计。</p>
            <a href="#" class="btn btn-primary">查看详情</a>
          </div>
        </div>
      </div>
      <!-- 第三张卡片 -->
      <div class="col-md-6 col-lg-4">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">JavaScript基础</h5>
            <p class="card-text">让页面动起来的第一门语言。</p>
            <a href="#" class="btn btn-primary">查看详情</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 页脚 -->
<footer class="bg-body-tertiary text-center py-3 mt-4">
  <p class="mb-0">© 2026 前端课程墙 · 仅供学习参考</p>
</footer>

  <!-- Bootstrap JS 可选，但按钮无需交互可不加 -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
