<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>光影摄影社 · 作品管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/works.js" defer></script>
</head>
<body>
    <!-- ===== 导航栏（三个模块共享） ===== -->
    <nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top shadow">
        <div class="container">
            <a class="navbar-brand" href="index.html"><span class="gold"></span> 光影摄影社</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto mb-2 mb-md-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">招新首页</a></li>
                    <li class="nav-item"><a class="nav-link active" href="works.html">作品管理</a></li>
                    <li class="nav-item"><a class="nav-link" href="stats.html">费用统计</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mb-5">
        <h2 class="fw-bold text-center mb-4 mt-2">摄影社团作品管理</h2>

        <div class="panel">
            <!-- 录入表单 -->
            <form id="photo-form">
                <input type="text" id="title" placeholder="作品名称 (必填)" required />
                <input type="text" id="author" placeholder="摄影师 (必填)" required />
                <input type="number" id="rating" placeholder="评分 1-5 (必填)" min="1" max="5" required />
                <button type="submit">添加作品</button>
            </form>
            <p id="error-msg"></p>

            <!-- 搜索与统计 -->
            <input type="text" id="search-input" placeholder="搜索作品或摄影师..." />
            <p id="total-count">当前共 0 件作品</p>

            <!-- 作品列表（动态渲染） -->
            <ul id="photo-list"></ul>

            <div class="text-end">
                <button id="export-btn" class="export-btn">导出 JSON 数据</button>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container text-center">
            <p class="mb-0">© 2026 光影摄影社 · 作品管理系统</p>
            <p class="small mt-1">数据保存在浏览器本地存储（localStorage）中</p>
        </div>
    </footer>
</body>
</html>
