<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>光影摄影社 · 数据看板</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="js/nav.js" defer></script>
  <script src="js/storage.js" defer></script>
  <script src="js/dashboard.js" defer></script>
</head>
<body>
  <div id="site-nav"></div>

  <div class="container">
    <div class="page-header">
      <h1>📊 数据看板</h1>
      <p id="time-display">数据加载耗时计算中...</p>
    </div>

    <!-- 状态提示区 -->
    <div id="status-loading" class="status-box loading">数据加载中，请稍候...</div>
    <div id="status-error" class="status-box error hidden">数据加载失败，请检查网络或 JSON 路径！</div>
    <div id="status-empty" class="status-box empty hidden">暂无数据，请等待社团录入。</div>

    <!-- 图表区 -->
    <section id="charts" class="hidden">
      <div id="controls" style="margin-bottom: 14px;">
        <button class="filter-btn active" data-filter="all">全部器材</button>
        <button class="filter-btn" data-filter="佳能">佳能</button>
        <button class="filter-btn" data-filter="索尼">索尼</button>
        <button class="filter-btn" data-filter="尼康">尼康</button>
        <button id="reload-btn" class="filter-btn" style="float:right;">↻ 重新加载</button>
      </div>

      <div class="grid cols-2">
        <div class="chart-wrapper">
          <h3>摄影社器材使用分布</h3>
          <p class="source">单位：人 | 数据来源：data/equipment.json</p>
          <div id="chart1" style="width: 100%; height: 320px;"></div>
        </div>
        <div class="chart-wrapper">
          <h3>2025 年月度投稿量</h3>
          <p class="source">单位：张 | 数据来源：data/submissions.json（点击左图柱子可联动）</p>
          <canvas id="chart2"></canvas>
        </div>
        <div class="chart-wrapper">
          <h3>本届报名者擅长领域</h3>
          <p class="source">数据来源：招新报名页保存的本地数据（localStorage）</p>
          <div id="chart3" style="width: 100%; height: 320px;"></div>
        </div>
        <div class="chart-wrapper">
          <h3>作品评分分布</h3>
          <p class="source">数据来源：作品管理页保存的本地数据（localStorage）</p>
          <canvas id="chart4"></canvas>
        </div>
      </div>
    </section>
  </div>

  <div id="site-footer"></div>
</body>
</html>
