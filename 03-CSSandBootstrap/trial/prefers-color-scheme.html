<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务二：Bootstrap data-bs-theme (无JS)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* 自定义区域，使用 Bootstrap 变量自动适配 */
        .custom-box {
            padding: 20px;
            margin-top: 20px;
            border-radius: 8px;
            background-color: var(--bs-body-bg);
            color: var(--bs-body-color);
            border: 2px solid var(--bs-border-color);
        }
        /* 显示当前主题状态的标签 */
        .theme-label::after {
            content: "☀️ 浅色模式";
        }
        html[data-bs-theme="dark"] .theme-label::after {
            content: "🌙 深色模式";
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <h1>深色模式测试</h1>
        <p class="lead">使用 <code>data-bs-theme</code> 属性</p>

        <!-- 状态标签（纯CSS显示，无需JS） -->
        <p>当前主题：<span class="theme-label badge bg-secondary"></span></p>

        <!-- Bootstrap 组件 -->
        <div class="card my-4">
            <div class="card-body">
                <h5 class="card-title">Bootstrap 卡片</h5>
                <p class="card-text">卡片背景和文字自动适配。</p>
                <a href="#" class="btn btn-primary">按钮</a>
            </div>
        </div>
    </div>
</body>
</html>
